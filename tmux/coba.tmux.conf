# coba for tmux: status line and borders.
#
# Colours here are ANSI indices, not hex, on purpose — same reasoning as
# ../zsh/coba.zsh. iTerm resolves 0-15 through whichever coba profile is
# active, so this follows the macOS light/dark switch for free and needs no
# per-variant edit.
#
#   1 red   2 green   3 yellow/ocre   4 blue   5 rose   6 teal   8 dim

set -g status-style "bg=default,fg=colour8"
set -g status-justify centre
set -g status-left ""
set -g status-right "#[fg=colour6]#S "

setw -g window-status-current-style "fg=colour4,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=colour8"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators arrows

set -g message-style "fg=colour3,bg=default"
